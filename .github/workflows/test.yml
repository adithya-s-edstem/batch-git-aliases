name: Test generate.bat

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-generate:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test generate.bat execution
      run: |
        # Run generate.bat
        .\generate.bat
        
    - name: Verify generated files
      run: |
        # Check if expected .bat files were created in aliases directory
        $expectedFiles = @(
          'pl.bat', 'gps.bat', 'st.bat', 'a.bat', 'c.bat', 'l.bat', 'br.bat', 'co.bat', 'd.bat', 'rs.bat',
          'sh.bat', 'pop.bat', 'f.bat', 'm.bat', 'cl.bat', 'ig.bat', 'grm.bat', 'tg.bat',
          'rb.bat', 'rbc.bat', 'rba.bat', 'gcp.bat', 'cb.bat', 'shl.bat', 'shd.bat', 'shc.bat',
          'sw.bat', 'bl.bat', 'rl.bat', 'clean.bat', 'gls.bat', 'lp.bat', 'df.bat', 'amend.bat', 'undo.bat'
        )
        
        $missingFiles = @()
        foreach ($file in $expectedFiles) {
          $filePath = Join-Path "aliases" $file
          if (-not (Test-Path $filePath)) {
            $missingFiles += $file
          }
        }
        
        if ($missingFiles.Count -gt 0) {
          Write-Host "Missing files in aliases directory: $($missingFiles -join ', ')" -ForegroundColor Red
          exit 1
        }
        
        Write-Host "All $($expectedFiles.Count) expected files were generated successfully in aliases directory!" -ForegroundColor Green
        
    - name: Test sample batch files functionality  
      run: |
        # Initialize a test git repo to test some aliases
        git config --global user.email "test@example.com"
        git config --global user.name "Test User"
        mkdir test-repo
        cd test-repo
        git init
        
        # Test basic functionality of a few generated aliases from aliases directory
        echo "test content" > test.txt
        
        # Test st.bat (git status)
        ..\aliases\st.bat
        
        # Test a.bat (git add .)
        ..\aliases\a.bat
        
        # Test c.bat (git commit -m)
        ..\aliases\c.bat "Initial commit"
        
        # Test l.bat (git log)
        ..\aliases\l.bat
        
        Write-Host "Basic alias functionality test completed!" -ForegroundColor Green

    - name: Count generated files
      run: |
        $aliasFiles = Get-ChildItem -Path "aliases" -Filter "*.bat" -ErrorAction SilentlyContinue
        Write-Host "Total generated .bat files in aliases directory: $($aliasFiles.Count)"
        
        if ($aliasFiles.Count -ne 35) {
          Write-Host "Expected 35 files but found $($aliasFiles.Count) in aliases directory" -ForegroundColor Red
          exit 1
        }
        
        Write-Host "Correct number of files generated (35) in aliases directory!" -ForegroundColor Green

  test-powershell-module:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test PowerShell module import
      run: |
        # Import the PowerShell module
        Import-Module .\GitAliases.psm1 -ErrorAction Stop
        Write-Host "✓ Module imported successfully" -ForegroundColor Green
        
    - name: Verify module exports 35 functions
      run: |
        Import-Module .\GitAliases.psm1
        $functionCount = (Get-Command -Module GitAliases).Count
        
        if ($functionCount -ne 35) {
          Write-Host "Expected 35 functions but found $functionCount" -ForegroundColor Red
          exit 1
        }
        
        Write-Host "✓ All 35 functions exported correctly" -ForegroundColor Green
        
    - name: Test gps function overrides Get-Process
      run: |
        # Check that gps is built-in alias before import
        $gpsBefore = Get-Command gps -ErrorAction SilentlyContinue
        if ($gpsBefore.CommandType -ne 'Alias') {
          Write-Host "Warning: gps is not an alias before import (expected Alias, got $($gpsBefore.CommandType))" -ForegroundColor Yellow
        }
        
        # Import module
        Import-Module .\GitAliases.psm1
        
        # Check that gps is now a function
        $gpsAfter = Get-Command gps
        if ($gpsAfter.CommandType -ne 'Function') {
          Write-Host "gps is not a function after import (got $($gpsAfter.CommandType))" -ForegroundColor Red
          exit 1
        }
        
        # Verify it calls git push
        if (-not ($gpsAfter.Definition -like '*git push*')) {
          Write-Host "gps function doesn't call git push" -ForegroundColor Red
          exit 1
        }
        
        Write-Host "✓ gps correctly overrides Get-Process alias" -ForegroundColor Green
        
    - name: Test PowerShell aliases functionality
      run: |
        # Initialize a test git repo
        git config --global user.email "test@example.com"
        git config --global user.name "Test User"
        mkdir test-ps-repo
        cd test-ps-repo
        git init
        
        # Import module
        Import-Module ..\GitAliases.psm1
        
        # Test st (git status)
        $statusOutput = st | Out-String
        if ($statusOutput -notlike '*On branch*') {
          Write-Host "st command failed" -ForegroundColor Red
          exit 1
        }
        Write-Host "✓ st (git status) works" -ForegroundColor Green
        
        # Test a (git add .)
        "test content" | Out-File test.txt
        a
        $status = git status --porcelain | Out-String
        if ($status -notlike '*test.txt*') {
          Write-Host "a command failed" -ForegroundColor Red
          exit 1
        }
        Write-Host "✓ a (git add .) works" -ForegroundColor Green
        
        # Test c with unquoted message
        c test commit message
        $commitMsg = git log --oneline -1 | Out-String
        if ($commitMsg -notlike '*test commit message*') {
          Write-Host "c command with unquoted message failed" -ForegroundColor Red
          exit 1
        }
        Write-Host "✓ c (git commit) works with unquoted message" -ForegroundColor Green
        
        # Test c with quoted message
        "test2" | Out-File test2.txt
        a
        c "quoted commit message"
        $commitMsg2 = git log --oneline -1 | Out-String
        if ($commitMsg2 -notlike '*quoted commit message*') {
          Write-Host "c command with quoted message failed" -ForegroundColor Red
          exit 1
        }
        Write-Host "✓ c (git commit) works with quoted message" -ForegroundColor Green
        
        # Test br (git branch -a)
        $branchOutput = br | Out-String
        if ($branchOutput -notlike '*master*' -and $branchOutput -notlike '*main*') {
          Write-Host "br command failed" -ForegroundColor Red
          exit 1
        }
        Write-Host "✓ br (git branch -a) works" -ForegroundColor Green
        
        # Test l (git log)
        $logOutput = l | Out-String
        if ($logOutput -notlike '*quoted commit message*') {
          Write-Host "l command failed" -ForegroundColor Red
          exit 1
        }
        Write-Host "✓ l (git log) works" -ForegroundColor Green
        
        Write-Host "All PowerShell alias functionality tests passed!" -ForegroundColor Green
        
    - name: Test install-powershell.ps1 script
      run: |
        # Create a temporary profile for testing
        $testProfileDir = Join-Path $env:TEMP "test-ps-profile"
        $testProfilePath = Join-Path $testProfileDir "Microsoft.PowerShell_profile.ps1"
        New-Item -ItemType Directory -Path $testProfileDir -Force | Out-Null
        
        # Mock the $PROFILE variable by setting it in the script environment
        $env:TEST_PROFILE_PATH = $testProfilePath
        
        # Run install script (we'll need to modify it slightly or test the core logic)
        # For now, test that the script can be parsed and key functions work
        $scriptContent = Get-Content .\install-powershell.ps1 -Raw
        if (-not ($scriptContent -like '*Import-Module*')) {
          Write-Host "install-powershell.ps1 doesn't contain Import-Module statement" -ForegroundColor Red
          exit 1
        }
        
        Write-Host "✓ install-powershell.ps1 script structure verified" -ForegroundColor Green
        
        # Clean up
        Remove-Item -Path $testProfileDir -Recurse -Force -ErrorAction SilentlyContinue